name: ISO C2 M4 Backup Continuity Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: iso-c2-m4-backup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'jburns2372-sys/RENTipid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_PROJECT_ID: holy-shape-01357429
      NEON_BRANCH_ID: br-proud-sunset-ap0ofil2
      M4_EVIDENCE_FILE: ${{ runner.temp }}/m4-evidence.json
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # History reads this exact successful step, independently of the freshness/alert outcome.
      - name: Collect provider evidence
        id: provider
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/security/check-backup-freshness.mjs
      - name: Enforce evidence freshness and reconcile incident
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security/backup-monitor-actions.mjs
      - name: Record sanitized evidence in run summary
        if: always()
        shell: bash
        run: |
          if [ -f "$M4_EVIDENCE_FILE" ]; then
            cat "$M4_EVIDENCE_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status":"UNHEALTHY","failure_reason":"EVIDENCE_UNAVAILABLE"}' >> "$GITHUB_STEP_SUMMARY"
          fi
