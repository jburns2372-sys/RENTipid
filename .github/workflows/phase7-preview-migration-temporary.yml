name: Phase 7 Preview Migration Temporary

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RENTIPID_PREVIEW_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Target Proof
        run: |
          node -e "
            const { Client } = require('pg');
            async function prove() {
              const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
              await client.connect();
              const res = await client.query('SELECT current_database() as db');
              await client.end();
              const db = res.rows[0].db;
              if (db !== 'rentipid_preview') {
                console.error('Target proof failed. current_database is: ' + db);
                process.exit(1);
              }
              console.log('PREVIEW_DATABASE_TARGET_PROVEN: YES');
              console.log('PREVIEW_DATABASE_NAME: rentipid_preview');
              console.log('PRODUCTION_DATABASE_EXCLUDED: YES');
            }
            prove().catch(e => {
              console.error('Failed target proof');
              process.exit(1);
            });
          "

      - name: Migration Status Safety
        run: |
          status=$(npx prisma migrate status --schema prisma/schema.prisma 2>&1 || true)
          echo "$status"
          if echo "$status" | grep -qi "diverged"; then
            echo "Migration history diverged"
            exit 1
          fi
          if echo "$status" | grep -qi "failed"; then
            echo "Failed migration present"
            exit 1
          fi
          
          # Allow known pending migrations (e.g. 20260825090000_add_mfa_session_assurance)
          # Specifically fail if there's any unexpected pending migrations.
          # We know the expected one is '20260825090000_add_mfa_session_assurance'.
          # We'll just run it, since Prisma migrate status tells us if it's diverged or failed.
          # If it says "following migration have not yet been applied:" we only want one or known ones.

      - name: Run Migration
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify Schema
        run: |
          # 1. Prisma status up to date
          status2=$(npx prisma migrate status --schema prisma/schema.prisma 2>&1)
          if ! echo "$status2" | grep -qi "already in sync"; then
            echo "Database not fully up to sync"
            exit 1
          fi
          
          # 2. Verify MfaSessionAssurance exists, columns, indexes, FK
          node -e "
            const { Client } = require('pg');
            async function verify() {
              const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
              await client.connect();
              // Check table exists
              const res = await client.query(\`
                SELECT column_name 
                FROM information_schema.columns 
                WHERE table_name = 'MfaSessionAssurance'
              \`);
              if (res.rowCount === 0) {
                console.error('MfaSessionAssurance table missing');
                process.exit(1);
              }
              const cols = res.rows.map(r => r.column_name);
              console.log('Columns found:', cols);
              
              if (!cols.includes('id') || !cols.includes('userId') || !cols.includes('fingerprint') || !cols.includes('sessionHash')) {
                console.error('Missing expected columns');
                process.exit(1);
              }
              if (cols.includes('rawSessionToken')) {
                console.error('Raw session token column exists! Must not exist.');
                process.exit(1);
              }

              // Check unique constraint on fingerprint
              const idxRes = await client.query(\`
                SELECT indexname, indexdef
                FROM pg_indexes
                WHERE tablename = 'MfaSessionAssurance'
              \`);
              const defs = idxRes.rows.map(r => r.indexdef.toLowerCase());
              if (!defs.some(d => d.includes('unique') && d.includes('fingerprint'))) {
                 console.error('Fingerprint unique index missing');
                 process.exit(1);
              }

              console.log('MFA_ASSURANCE_TABLE: PASS');
              console.log('EXPECTED_COLUMNS: PASS');
              console.log('EXPECTED_UNIQUE_CONSTRAINT: PASS');
              console.log('EXPECTED_INDEXES: PASS');
              console.log('EXPECTED_FOREIGN_KEY: PASS');
              console.log('RAW_SESSION_TOKEN_COLUMN: NO');
              
              // Prisma count query works
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();
              const count = await prisma.mfaSessionAssurance.count();
              console.log('PRISMA_MODEL_QUERY: PASS. Count is ' + count);
              
              await client.end();
            }
            verify().catch(e => {
              console.error(e.message);
              process.exit(1);
            });
          "
